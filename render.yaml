services:
  - type: web
    name: unifind-campus-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: campus_lost_and_found
      - key: SECRET_KEY
        generateValue: true
